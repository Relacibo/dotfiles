# nsync — Konfiguration. Diese Datei lebt im dotfiles-Repo (syncbar, KEIN Passwort!).
# Das Passwort liegt maschinenlokal in PASS_FILE (obscured-Form, erzeugt via: rclone obscure).

# Ziel-Remote — rclone-Definition per Umgebungsvariable, kein Eintrag in rclone.conf noetig
REMOTE_NAME="ovilava-notes"
REMOTE_TYPE="webdav"
REMOTE_URL="https://cloud.rcbnet.work/dav"
REMOTE_VENDOR="owncloud"
REMOTE_USER="reinhard"
PASS_FILE="$HOME/.config/nsync/ovilava-notes.pass"

# Sync-Parameter
LOCAL="$HOME/notes"
SUBDIR="notizen"
FILTERS="$HOME/.config/nsync/filters.txt"
LOG="$HOME/.local/state/nsync.log"
RCLONE="rclone"
GIT_DIR="$HOME/notes"

# Timer-Intervall (wird von "nsync install" als systemd-Drop-In gesetzt; ohne diesen Key gilt die Unit-Datei)
INTERVAL="*:0/15"
