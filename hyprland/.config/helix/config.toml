theme = "github_dark_high_contrast_custom"
# theme = "github_light_high_contrast"

[keys.insert]
"C-space" = "completion"

[keys.normal]
"C-space" = "completion"
[keys.normal.space]
"l" = ":lsp-stop"
"L" = ":lsp-restart"
"u" = ":theme github_dark_high_contrast_custom_no_underlines"
"U" = ":theme github_dark_high_contrast_custom"
# todo.txt: Zeile abhaken (todofmt done = x + heutiges Datum, idempotent).
# Kein per-Language-Keybind in Helix — global gebunden, im Zweifel undo (u).
"x" = ["extend_to_line_bounds", ":pipe todofmt done"]
